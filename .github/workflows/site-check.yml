name: Site visual check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check pages and capture screenshots
        run: node tests/site-check.mjs
      - name: Package validated site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reported-site-screenshots
          path: site-screenshots/
          if-no-files-found: warn
          retention-days: 30

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only after browser checks pass
        id: deployment
        uses: actions/deploy-pages@v4
